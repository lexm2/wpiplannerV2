name: Update Course Data and Deploy

on:
  push:
    branches:
      - master
  schedule:
    - cron: '*/15 * * * *' # Every 15 minutes
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: course-data-update
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch latest course data
        run: |
          mkdir -p public
          bun run fetch-data

      - name: Run TypeScript converter
        run: bun run convert
      
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet public/course-data.json public/course-data-constructed.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit course data changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          # Create timestamp file with current UTC time
          echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\",\"utc\":\"$(date -u +%Y-%m-%d\ %H:%M\ UTC)\"}" > public/last-updated.json

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/course-data.json public/course-data-constructed.json public/last-updated.json public/term-bounds.json
          git commit -m "Update course data $(date -u +%Y-%m-%d\ %H:%M\ UTC)"
          git pull --rebase origin master
          git push

      # Gate the deploy. Deliberately typecheck + unit tests only: this job runs
      # every 15 minutes, so no browser download and no e2e flake blocking a
      # data refresh. The full suite runs in ci.yml on pull requests.
      # A failure here stops the deploy but leaves the data commit above intact,
      # so course data stays fresh even while app code is broken.
      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build TypeScript application
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: bun run build
      
      - name: Copy course data to build output
        run: |
          cp public/course-data.json dist/
          cp public/course-data-constructed.json dist/
          cp public/last-updated.json dist/
          cp public/term-bounds.json dist/
          echo "Course data files copied to dist/"
          ls -la dist/*.json
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          enable_jekyll: false