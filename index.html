<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%APP_TITLE%</title>
    <meta name="description" content="%APP_DESCRIPTION%" />
    <meta
      name="keywords"
      content="WPI, Worcester Polytechnic Institute, course planner, academic planning, schedule, courses, registration"
    />
    <meta name="author" content="%APP_AUTHOR%" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%APP_URL%" />
    <meta property="og:title" content="%APP_TITLE%" />
    <meta property="og:description" content="%APP_DESCRIPTION%" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:url" content="%APP_URL%" />
    <meta property="twitter:title" content="%APP_TITLE%" />
    <meta property="twitter:description" content="%APP_DESCRIPTION%" />

    <!-- Canonical URL -->
    <link rel="canonical" href="%APP_URL%" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "%APP_TITLE%",
        "description": "%APP_DESCRIPTION%",
        "url": "%APP_URL%",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web Browser",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "creator": {
          "@type": "Person",
          "name": "%APP_AUTHOR%"
        }
      }
    </script>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" sizes="any" />
    <link rel="shortcut icon" href="./favicon.ico" />
  </head>
  <body>
    <!-- App.svelte (mounted from main.ts) renders the entire app shell here. -->
    <div id="app"></div>

    <!-- Mount host for the declarative Svelte modal layer (ModalLayer.svelte),
         kept outside #app so modal stacking is independent of the app layout. -->
    <div id="modal-root"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
