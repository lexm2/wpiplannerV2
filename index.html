<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPI Course Planner</title>
    <meta name="description" content="Unofficial WPI academic schedule planner for Worcester Polytechnic Institute.">
    <meta name="keywords" content="WPI, Worcester Polytechnic Institute, course planner, academic planning, schedule, courses, registration">
    <meta name="author" content="WPI Course Planner">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://lexm2.github.io/wpiplannerV2/">
    <meta property="og:title" content="WPI Course Planner">
    <meta property="og:description" content="Unofficial WPI academic schedule planner.">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary">
    <meta property="twitter:url" content="https://lexm2.github.io/wpiplannerV2/">
    <meta property="twitter:title" content="WPI Course Planner">
    <meta property="twitter:description" content="Unofficial WPI academic schedule planner.">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://lexm2.github.io/wpiplannerV2/">
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "WPI Course Planner",
      "description": "Referbished class planner for WPI students",
      "url": "https://lexm2.github.io/wpiplannerV2/",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "creator": {
        "@type": "Person",
        "name": "Lex"
      }
    }
    </script>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="icon" type="image/x-icon" href="./favicon.ico" sizes="any">
    <link rel="shortcut icon" href="./favicon.ico">
</head>
<body>
    <div id="app">
        <header class="app-header" role="banner">
            <div class="header-content">
                <div class="header-left">
                    <h1>WPI Course Planner</h1>
                    <div class="header-subtitle">
                        <div class="timestamps-container">
                            <span id="client-timestamp">Loading client data...</span>
                            <span id="server-timestamp">Loading server data...</span>
                        </div>
                    </div>
                </div>
                <nav class="header-navigation" role="navigation" aria-label="Main navigation">
                    <div class="nav-tabs-pill">
                        <button id="planner-tab" class="nav-tab active" aria-label="Classes view">Classes</button>
                        <button id="schedule-tab" class="nav-tab" aria-label="Schedule view">Schedule</button>
                    </div>
                </nav>
                <div class="header-controls">
<button id="settings-menu-btn" class="btn btn-icon settings-menu-btn" title="Settings" aria-label="Settings menu"></button>
                    <div class="undo-redo-controls">
                        <button id="undo-btn" class="btn btn-icon" title="Undo (Ctrl+Z)" disabled></button>
                        <button id="redo-btn" class="btn btn-icon" title="Redo (Ctrl+Y)" disabled></button>
                    </div>
                    <button id="schedule-picker-btn" class="btn btn-icon" title="Select Schedule">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                        <span id="schedule-picker-label">Schedule</span>
                    </button>
                    <div class="theme-selector">
                        <div class="theme-dropdown" id="theme-dropdown">
                            <span id="current-theme-name">WPI Classic</span>
                            <span class="dropdown-arrow" id="theme-dropdown-arrow"></span>
                        </div>
                        <div class="theme-options" id="theme-options">
                            <!-- Theme options will be populated by ThemeSelector -->
                        </div>
                    </div>
                </div>
            </div>
        </header>
        
        <div class="app-body" id="planner-page">
            <aside class="sidebar" role="complementary" aria-label="Department navigation">
                <div class="department-categories" id="department-list">
                    <div class="loading-message">Loading departments...</div>
                </div>
            </aside>

            <div class="resize-handle resize-handle-left" data-resize="sidebar" role="separator" aria-orientation="vertical" aria-label="Resize left sidebar"></div>

            <main class="main-content" role="main">
                <div class="content-header">
                    <div class="content-controls">
                        <div class="search-input-wrapper">
                            <input type="text" id="search-input" placeholder="Search courses..." class="search-input" aria-label="Search courses">
                            <div id="search-professor-dropdown" class="professor-dropdown" style="display:none;"></div>
                            <button id="search-mode-btn" class="search-mode-btn" title="Search professors" aria-label="Toggle professor search"></button>
                            <button id="search-clear-btn" class="search-clear-btn" title="Clear search" aria-label="Clear search" hidden></button>
                        </div>
                        <div id="filter-buttons-host" class="content-controls-filter-host"></div>
                        <div id="view-toggle" class="view-toggle"></div>
                    </div>
                </div>
                <div class="course-container" id="course-container">
                    <div class="loading-message">Loading courses...</div>
                </div>
            </main>

            <div class="resize-handle resize-handle-right" data-resize="right-panel" role="separator" aria-orientation="vertical" aria-label="Resize right panel"></div>

            <aside class="right-panel" role="complementary" aria-label="Course details and selection">
<section class="selected-courses-section">
                    <div class="selected-courses-header" id="selected-courses-header" role="button" tabindex="0" aria-expanded="false" aria-controls="selected-courses-list">
                        <h3 class="selected-courses-title">
                            Selected Courses
                            <span id="selected-count" class="course-count"></span>
                        </h3>
                        <span class="chevron-icon" id="selected-courses-chevron"></span>
                    </div>
                    <div class="selected-courses-content" id="selected-courses-list">
                        <div class="empty-state">No courses selected yet</div>
                    </div>
                </section>
                <section class="course-description-section">
                    <div class="course-description-content" id="course-description">
                        <div class="empty-state">Select a course to view description</div>
                    </div>
                </section>
            </aside>
        </div>
        
        <div class="app-body schedule-page" id="schedule-page" style="display: none;">
            <div class="schedule-page-layout">
                <aside class="schedule-sidebar">
                    <div class="schedule-sidebar-header">
                        <div class="schedule-filter-controls">
                            <div id="calendar-events-header-slot" class="calendar-events-header-slot"></div>
                            <button id="schedule-filter-btn" class="btn btn-secondary filter-btn" title="Filter selected courses">
                            </button>
<!-- ClearAllSectionsButton.svelte mounts the clear-all button into this slot. -->
                            <div id="clear-all-sections-slot" style="display: contents"></div>
                        </div>
                    </div>
                    <div class="schedule-sidebar-content" id="schedule-sidebar-content">
                        <!-- ScheduleSidebar.svelte mounts into this display:contents wrapper;
                             the vanilla wizard panel is appendChild'd to the parent as a sibling. -->
                        <div id="schedule-sidebar-courses" style="display: contents"></div>
                    </div>
                    <!-- AutoScheduleControls.svelte mounts here (footer button + nav + progress). -->
                    <div class="schedule-sidebar-content-footer"></div>
                </aside>

                <div class="resize-handle resize-handle-schedule" data-resize="schedule-sidebar" role="separator" aria-orientation="vertical" aria-label="Resize schedule sidebar"></div>

                <main class="schedule-main">
                    <!-- ScheduleGrids.svelte renders the .terms-grid + 4 term grids
                         into this display:contents host (declarative grid). -->
                    <div id="schedule-grids-root" style="display: contents"></div>
                </main>
            </div>
        </div>
    </div>

    <!-- Mount host for the declarative Svelte modal layer (ModalLayer.svelte). -->
    <div id="modal-root"></div>

    <!-- Google API Scripts for Cloud Sync -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
