<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPI Course Planner</title>
    <meta name="description" content="Unofficial WPI academic schedule planner for Worcester Polytechnic Institute.">
    <meta name="keywords" content="WPI, Worcester Polytechnic Institute, course planner, academic planning, schedule, courses, registration">
    <meta name="author" content="WPI Course Planner">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://lexm2.github.io/wpiplannerV2/">
    <meta property="og:title" content="WPI Course Planner">
    <meta property="og:description" content="Unofficial WPI academic schedule planner.">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary">
    <meta property="twitter:url" content="https://lexm2.github.io/wpiplannerV2/">
    <meta property="twitter:title" content="WPI Course Planner">
    <meta property="twitter:description" content="Unofficial WPI academic schedule planner.">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://lexm2.github.io/wpiplannerV2/">
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "WPI Course Planner",
      "description": "Referbished class planner for WPI students",
      "url": "https://lexm2.github.io/wpiplannerV2/",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "creator": {
        "@type": "Person",
        "name": "Lex"
      }
    }
    </script>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="icon" type="image/x-icon" href="./favicon.ico" sizes="any">
    <link rel="shortcut icon" href="./favicon.ico">
</head>
<body>
    <!-- App.svelte (mounted from main.ts) renders the entire app shell here. -->
    <div id="app"></div>

    <!-- Mount host for the declarative Svelte modal layer (ModalLayer.svelte),
         kept outside #app so modal stacking is independent of the app layout. -->
    <div id="modal-root"></div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
