# Example /etc/httpd/conf.d/wpiplanner.conf. install.sh writes this file
# itself; it is here for setting the app up by hand (see deploy/rhel.md).
# Replace planner.example.edu and the certificate paths.

# Plain HTTP only sends visitors to HTTPS.
<VirtualHost *:80>
    ServerName planner.example.edu
    Redirect permanent / https://planner.example.edu/
</VirtualHost>

<VirtualHost *:443>
    ServerName planner.example.edu

    SSLEngine on
    # Certificate followed by its intermediate chain, in one PEM file.
    SSLCertificateFile /etc/pki/tls/certs/planner.example.edu.pem
    SSLCertificateKeyFile /etc/pki/tls/private/planner.example.edu.key

    Include /etc/httpd/wpiplanner/app.conf
</VirtualHost>

# Without a certificate, serve the app over HTTP instead:
#
# <VirtualHost *:80>
#     ServerName planner.example.edu
#     Include /etc/httpd/wpiplanner/app.conf
# </VirtualHost>
