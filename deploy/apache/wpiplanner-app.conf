# WPI Planner for Apache httpd 2.4: the counterpart of docker/nginx.conf.
# Include it inside each <VirtualHost> that serves the app (see
# deploy/apache/wpiplanner.conf); it is not meant for conf.d on its own.
#
# Needs mod_alias, mod_deflate, mod_dir, mod_headers, mod_mime and
# mod_rewrite, all loaded by RHEL's stock httpd.
#
#   /var/www/wpiplanner/wpiplannerV2   the built app (deploy/prepare-dist.sh)
#   /var/www/wpiplanner-data           live course data, written by the fetcher
#
# Both sit under /var/www, which SELinux already labels for httpd to read.

DocumentRoot "/var/www/wpiplanner"

RedirectMatch 302 "^/$" "/wpiplannerV2/"

# Live data, served straight from the fetcher's directory. The optional .gz
# lets the rewrite below hand out the fetcher's precompressed catalog.
AliasMatch "^/wpiplannerV2/((course-data-constructed|last-updated|term-bounds)\.json(\.gz)?)$" \
    "/var/www/wpiplanner-data/$1"
# rateMyProfessor.json and tutorial-courses.json come from the built app.

# Serve a precompressed file.gz when one sits beside the file, as nginx's
# gzip_static does: the fetcher writes one for the catalog, prepare-dist.sh
# for the app files. Done here rather than per directory, where a rewrite
# would come back as a URL the AliasMatch above has to map again anyway.
RewriteEngine On
RewriteCond "%{HTTP:Accept-Encoding}" "gzip"
RewriteCond "/var/www/wpiplanner-data/$1.gz" -f
RewriteRule "^/wpiplannerV2/((course-data-constructed|last-updated|term-bounds)\.json)$" \
    "/wpiplannerV2/$1.gz" [PT,E=no-gzip:1]
RewriteCond "%{HTTP:Accept-Encoding}" "gzip"
RewriteCond "%{DOCUMENT_ROOT}%{REQUEST_URI}.gz" -f
RewriteRule "^/wpiplannerV2/.+" "%{REQUEST_URI}.gz" [PT,E=no-gzip:1]

# A .gz keeps the type of the file it stands in for; RHEL's mime config would
# otherwise send it as a gzip download.
<FilesMatch "\.gz$">
    AddEncoding gzip .gz
</FilesMatch>
<FilesMatch "\.js\.gz$">
    ForceType text/javascript
</FilesMatch>
<FilesMatch "\.css\.gz$">
    ForceType text/css
</FilesMatch>
<FilesMatch "\.html\.gz$">
    ForceType "text/html; charset=utf-8"
</FilesMatch>
<FilesMatch "\.json\.gz$">
    ForceType application/json
</FilesMatch>
<FilesMatch "\.svg\.gz$">
    ForceType image/svg+xml
</FilesMatch>
<FilesMatch "\.txt\.gz$">
    ForceType "text/plain; charset=utf-8"
</FilesMatch>
<FilesMatch "\.xml\.gz$">
    ForceType application/xml
</FilesMatch>

# Compress the rest on the fly, and let a proxy or CDN in front cache gzipped
# and plain copies separately.
AddOutputFilterByType DEFLATE text/html text/css text/plain text/xml text/javascript \
    application/javascript application/json application/xml image/svg+xml
<FilesMatch "\.(js|css|html|json|svg|txt|xml)(\.gz)?$">
    Header merge Vary Accept-Encoding
</FilesMatch>

<Directory "/var/www/wpiplanner-data">
    Require all granted
    Options None
    AllowOverride None
    Header always set Cache-Control "no-cache"
</Directory>

<Directory "/var/www/wpiplanner">
    Require all granted
    Options None
    AllowOverride None
</Directory>

<Directory "/var/www/wpiplanner/wpiplannerV2">
    DirectoryIndex index.html
    FallbackResource /wpiplannerV2/index.html
</Directory>

<Directory "/var/www/wpiplanner/wpiplannerV2/assets">
    # A missing hashed asset is a 404, not the app's index.html.
    FallbackResource disabled
    # Not on errors, so a 404 is not cached for a year. Apache keeps this
    # header on error responses unless told otherwise.
    Header set Cache-Control "public, max-age=31536000, immutable" "expr=%{REQUEST_STATUS} -lt 400"
</Directory>
