server {
    listen 80;
    server_name _;

    # Relative Location headers, so redirects keep whatever host port maps to 80.
    absolute_redirect off;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;
    # Lets a proxy or CDN in front cache gzipped and plain copies separately.
    gzip_vary on;
    # Serve a precompressed file.gz when one sits beside the file: the
    # fetcher writes one for the catalog, the image build for the app files.
    gzip_static on;

    location = / {
        return 302 /wpiplannerV2/;
    }

    # Live data, served straight from the fetcher's shared volume.
    location = /wpiplannerV2/course-data-constructed.json {
        alias /data/course-data-constructed.json;
        add_header Cache-Control "no-cache" always;
    }
    location = /wpiplannerV2/last-updated.json {
        alias /data/last-updated.json;
        add_header Cache-Control "no-cache" always;
    }
    location = /wpiplannerV2/term-bounds.json {
        alias /data/term-bounds.json;
        add_header Cache-Control "no-cache" always;
    }
    # rateMyProfessor.json and tutorial-courses.json come from the built dist.

    location /wpiplannerV2/assets/ {
        expires 1y;
        # No `always`: a 404 must not be cached for a year.
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /wpiplannerV2/ {
        try_files $uri $uri/ /wpiplannerV2/index.html;
    }
}
