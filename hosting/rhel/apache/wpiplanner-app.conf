# WPI Planner on Apache 2.4, the counterpart of docker/nginx.conf. Include it in
# each <VirtualHost> serving the app (see wpiplanner-vhost.conf). Needs only
# stock RHEL modules, all loaded by the httpd package's conf.modules.d: alias,
# deflate, dir, headers, mime, rewrite, and proxy and proxy_http (00-proxy.conf).
#
#   /var/www/wpiplanner/wpiplannerV2   the built app
#   /var/www/wpiplanner-data           live data, written by the fetcher
#   127.0.0.1:8008                     the course API (wpiplanner-api.service)
#
# Both directories are under /var/www, which SELinux already lets httpd read.
# Reaching the API needs: setsebool -P httpd_can_network_relay 1

DocumentRoot "/var/www/wpiplanner"

RedirectMatch 302 "^/$" "/wpiplannerV2/"

# The course API and MCP endpoint. Proxied URLs never map to a file, so the
# app's FallbackResource and the .gz rewrites below leave them alone. retry=0:
# by default a refused connection, as during an API restart, makes Apache
# answer 503 for the next 60 seconds without trying.
ProxyPass        "/wpiplannerV2/api/" "http://127.0.0.1:8008/wpiplannerV2/api/" retry=0
ProxyPassReverse "/wpiplannerV2/api/" "http://127.0.0.1:8008/wpiplannerV2/api/"
# MCP replies can be SSE streams; flushpackets sends each event on at once.
ProxyPassMatch   "^(/wpiplannerV2/mcp/?)$" "http://127.0.0.1:8008$1" \
    flushpackets=on timeout=300 retry=0
ProxyPassReverse "/wpiplannerV2/mcp" "http://127.0.0.1:8008/wpiplannerV2/mcp"

# Live data from the fetcher's directory; the optional .gz is for the rewrite below.
AliasMatch "^/wpiplannerV2/((course-data-constructed|last-updated|term-bounds)\.json(\.gz)?)$" \
    "/var/www/wpiplanner-data/$1"
# rateMyProfessor.json and tutorial-courses.json come from the build.

# Serve file.gz when present, like nginx's gzip_static. Server-level, since a
# per-directory rewrite comes back as a URL that AliasMatch must map again.
RewriteEngine On
RewriteCond "%{HTTP:Accept-Encoding}" "gzip"
RewriteCond "/var/www/wpiplanner-data/$1.gz" -f
RewriteRule "^/wpiplannerV2/((course-data-constructed|last-updated|term-bounds)\.json)$" \
    "/wpiplannerV2/$1.gz" [PT,E=no-gzip:1]
RewriteCond "%{HTTP:Accept-Encoding}" "gzip"
RewriteCond "%{DOCUMENT_ROOT}%{REQUEST_URI}.gz" -f
RewriteRule "^/wpiplannerV2/.+" "%{REQUEST_URI}.gz" [PT,E=no-gzip:1]

# Keep each .gz's real type; RHEL's mime config would make it a gzip download.
<FilesMatch "\.gz$">
    AddEncoding gzip .gz
</FilesMatch>
<FilesMatch "\.js\.gz$">
    ForceType text/javascript
</FilesMatch>
<FilesMatch "\.css\.gz$">
    ForceType text/css
</FilesMatch>
<FilesMatch "\.html\.gz$">
    ForceType "text/html; charset=utf-8"
</FilesMatch>
<FilesMatch "\.json\.gz$">
    ForceType application/json
</FilesMatch>
<FilesMatch "\.svg\.gz$">
    ForceType image/svg+xml
</FilesMatch>
<FilesMatch "\.txt\.gz$">
    ForceType "text/plain; charset=utf-8"
</FilesMatch>
<FilesMatch "\.xml\.gz$">
    ForceType application/xml
</FilesMatch>

AddOutputFilterByType DEFLATE text/html text/css text/plain text/xml text/javascript \
    application/javascript application/json application/xml image/svg+xml
<FilesMatch "\.(js|css|html|json|svg|txt|xml)(\.gz)?$">
    Header merge Vary Accept-Encoding
</FilesMatch>

<Directory "/var/www/wpiplanner-data">
    Require all granted
    Options None
    AllowOverride None
    Header always set Cache-Control "no-cache"
</Directory>

<Directory "/var/www/wpiplanner">
    Require all granted
    Options None
    AllowOverride None
</Directory>

<Directory "/var/www/wpiplanner/wpiplannerV2">
    DirectoryIndex index.html
    FallbackResource /wpiplannerV2/index.html
</Directory>

<Directory "/var/www/wpiplanner/wpiplannerV2/assets">
    # A missing hashed asset is a 404, not the app's index.html.
    FallbackResource disabled
    # Not on errors, which Apache would otherwise include: no year-long 404s.
    Header set Cache-Control "public, max-age=31536000, immutable" "expr=%{REQUEST_STATUS} -lt 400"
</Directory>
