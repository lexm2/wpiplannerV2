# Behind install.sh's host nginx, keep the scheme the client used.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # Relative redirects keep whatever host port maps to 80.
    absolute_redirect off;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_static on;

    location = / {
        return 302 /wpiplannerV2/;
    }

    # Live data, served straight from the fetcher's shared volume.
    location = /wpiplannerV2/course-data-constructed.json {
        alias /data/course-data-constructed.json;
        add_header Cache-Control "no-cache" always;
    }
    location = /wpiplannerV2/last-updated.json {
        alias /data/last-updated.json;
        add_header Cache-Control "no-cache" always;
    }
    location = /wpiplannerV2/term-bounds.json {
        alias /data/term-bounds.json;
        add_header Cache-Control "no-cache" always;
    }
    # rateMyProfessor.json and tutorial-courses.json come from the build.

    location /wpiplannerV2/assets/ {
        expires 1y;
        # No `always`: a 404 must not be cached for a year.
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The course API and MCP endpoint, ahead of the SPA's index.html fallback.
    # Resolved per request through Docker's DNS, so web starts without api and
    # follows it when a rebuild gives it a new address.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:3001;
    location /wpiplannerV2/api/ {
        proxy_pass         $api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
    }
    location = /wpiplannerV2/mcp {
        proxy_pass         $api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        # Replies can be SSE streams; pass each event on as it is written.
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }

    location /wpiplannerV2/ {
        try_files $uri $uri/ /wpiplannerV2/index.html;
    }
}
