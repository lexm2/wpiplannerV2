# Build context is the repo root. `name` keeps the project, and its volume,
# from when this file sat at the root.
name: wpiplannerv2

services:
  web:
    build:
      context: ../..
      dockerfile: hosting/docker/web.Dockerfile
    image: wpiplannerv2-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    volumes:
      - course-data:/data:ro
    depends_on:
      - fetcher

  fetcher:
    build:
      context: ../..
      dockerfile: hosting/docker/fetcher.Dockerfile
    image: wpiplannerv2-fetcher
    restart: unless-stopped
    environment:
      REFRESH_INTERVAL_SECONDS: '900'
      DATA_DIR: /data
    volumes:
      - course-data:/data

volumes:
  course-data:
